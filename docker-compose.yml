services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Porta NAO exposta ao host: acessivel apenas na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      APP_TZ: ${APP_TZ:-America/Sao_Paulo}
      # Avisos por e-mail (Resend via SMTP). Vazio = avisos desligados.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Nexus Worklog <nexus@localhost>}
      APP_URL: ${APP_URL:-https://nexus.shadow.tec.br}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    # Nao exposto a internet: so o nginx (rede interna) fala com a API.

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal]
    # Publicado SO no loopback do host: quem alcanca o nginx e o cloudflared
    # instalado na propria maquina (servico systemd), nunca a internet direto.
    ports: ["127.0.0.1:${WEB_PORT:-80}:80"]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
