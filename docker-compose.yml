services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Porta NAO exposta ao host: acessivel apenas na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    # Todas as variáveis vêm do .env; os padrões ficam num lugar só (app/config.py).
    env_file: .env
    # Teto de memória: se um relatório enorme estourar, cai o backend (que
    # reinicia), não o Postgres.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    # Nao exposto a internet: so o nginx (rede interna) fala com a API.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Publicado SO no loopback do host: quem alcanca o nginx e o cloudflared
    # instalado na propria maquina (servico systemd), nunca a internet direto.
    ports: ["127.0.0.1:${WEB_PORT:-80}:80"]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
