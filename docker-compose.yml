# Logs com rotação (são o único monitoramento: inclui os erros do navegador).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    # O /dev/shm padrão do Docker (64 MB) não comporta consulta paralela em tabela
    # grande: o Postgres respondia "could not resize shared memory segment" (erro 500).
    shm_size: 256m
    # Só as capacidades que o Postgres usa para trocar para o usuário postgres e
    # cuidar do volume; nenhum processo ganha privilégio depois de iniciado.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Porta NAO exposta ao host: acessivel apenas na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    logging: *logging
    build: ./backend
    restart: unless-stopped
    # Sem capacidades e sem ganho de privilégio. (Disco só leitura fica de fora:
    # o fotos.zip grava o temporário em /tmp e, em tmpfs, ele contaria na memória.)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Todas as variáveis vêm do .env; os padrões ficam num lugar só (app/config.py).
    env_file: .env
    # Versão e último backup gravados pelo deploy.sh (Saúde do Nexus, Admin > Geral).
    # Só leitura e só esta pasta: o backend nunca vê os dumps em backups/.
    volumes:
      - ./estado:/app/estado:ro
    # Teto de memória: se um relatório enorme estourar, cai o backend (que
    # reinicia), não o Postgres.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    # Nao exposto a internet: so o nginx (rede interna) fala com a API.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    logging: *logging
    build: ./web
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]   # o mestre do nginx troca para o usuário nginx
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Publicado SO no loopback do host: quem alcanca o nginx e o cloudflared
    # instalado na propria maquina (servico systemd), nunca a internet direto.
    ports: ["127.0.0.1:${WEB_PORT:-80}:80"]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
