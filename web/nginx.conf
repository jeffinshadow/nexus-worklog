worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # IP real do cliente. Atras do Cloudflare Tunnel, $remote_addr e o container
    # do cloudflared; o IP verdadeiro chega em CF-Connecting-IP, que a borda da
    # Cloudflare sempre reescreve (o cliente nao consegue forja-lo). Sem esse
    # header (acesso local), vale o endereco da conexao.
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    gzip            on;
    gzip_comp_level 6;
    gzip_types      text/css application/javascript application/json image/svg+xml
                    font/woff2 text/plain;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- Headers de seguranca (aplicados a todas as respostas) ----
        # CSP rigida: sem unsafe-inline / unsafe-eval. CSS e JS sao externos.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # ---- API -> backend (rede interna) ----
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Unico header de IP em que o backend confia (sempre sobrescrito aqui).
            proxy_set_header X-Client-IP       $client_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- MCP (IA) -> backend. So POST com chave de API; ver routers/mcp.py.
        location = /mcp {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Client-IP       $client_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---- Estaticos: revalidacao condicional (evita CSS/JS obsoleto no cache
        #      do navegador apos deploy). 'expires -1' gera 'Cache-Control: no-cache';
        #      como o nginx ja envia ETag/Last-Modified, o browser revalida e recebe
        #      304 quando nada mudou -- barato e sempre correto. Usa 'expires' (nao
        #      'add_header') justamente para NAO resetar os headers de seguranca
        #      herdados do server. ----
        location ~* \.(?:css|js|woff2|svg|png|webp|avif|ico)$ {
            expires -1;
            try_files $uri =404;
        }

        # ---- Web App Manifest (PWA): MIME correto; a regex de estaticos acima
        #      nao cobre .webmanifest. default_type/expires nao resetam os
        #      add_header de seguranca herdados. ----
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            expires -1;
            try_files $uri =404;
        }

        # ---- HTML / navegacao: revalida sempre (sem isso o navegador podia
        #      mostrar uma tela antiga depois de um deploy). ----
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
