worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # IP real do cliente. Atras do Cloudflare Tunnel (cloudflared no host),
    # $remote_addr e o gateway do Docker; o IP verdadeiro chega em CF-Connecting-IP, que a borda da
    # Cloudflare sempre reescreve (o cliente nao consegue forja-lo). Sem esse
    # header (acesso local), vale o endereco da conexao.
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    gzip            on;
    gzip_comp_level 6;
    gzip_types      text/css application/javascript application/json image/svg+xml
                    font/woff2 text/plain;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- Headers de seguranca (aplicados a todas as respostas) ----
        # CSP rigida: sem unsafe-inline / unsafe-eval. CSS e JS sao externos.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # ---- Backend (rede interna): /api/ e /mcp (IA, so POST com chave).
        # X-Client-IP e o unico header de IP em que o backend confia (sempre
        # sobrescrito aqui). Valem para todos os proxy_pass abaixo.
        proxy_http_version 1.1;
        proxy_set_header Host        $host;
        proxy_set_header X-Client-IP $client_ip;
        proxy_read_timeout 60s;

        location /api/ {
            proxy_pass http://backend:8000;
        }
        # Foto (até 1 MB, mais a miniatura) vai em base64 no JSON: ~1,5 MB. O resto da API segue com 1 MB.
        location ~ ^/api/(worklog|recurring)/[0-9]+/photos$ {
            client_max_body_size 2m;
            proxy_pass http://backend:8000;
        }
        # PDF grande pode passar de 60 s (o front espera até 90 s).
        location ~ ^/api/(reports|viewer)/ {
            proxy_read_timeout 95s;
            proxy_pass http://backend:8000;
        }
        location = /mcp {
            proxy_pass http://backend:8000;
        }
        # Estado do link (aba Calendário). Sem esta rota exata, o prefixo abaixo
        # (com barra) faz o nginx responder 301 para /api/calendar/.
        location = /api/calendar {
            proxy_pass http://backend:8000;
        }
        # O link do calendario carrega um segredo no caminho: fora do log de acesso.
        location ^~ /api/calendar/ {
            access_log off;
            error_log /dev/null;  # erro de upstream também gravaria o caminho
            proxy_pass http://backend:8000;
        }

        # ---- Estaticos: revalidacao condicional (evita CSS/JS obsoleto no cache
        #      do navegador apos deploy). 'expires -1' gera 'Cache-Control: no-cache';
        #      como o nginx ja envia ETag/Last-Modified, o browser revalida e recebe
        #      304 quando nada mudou -- barato e sempre correto. Usa 'expires' (nao
        #      'add_header') justamente para NAO resetar os headers de seguranca
        #      herdados do server. ----
        location ~* \.(?:css|js|woff2|svg|png|webp|avif|ico)$ {
            expires -1;
            try_files $uri =404;
        }

        # ---- Web App Manifest (PWA): MIME correto; a regex de estaticos acima
        #      nao cobre .webmanifest. default_type/expires nao resetam os
        #      add_header de seguranca herdados. ----
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            expires -1;
            try_files $uri =404;
        }

        # ---- Enderecos sem .html: o app em / e o login em /login. Os antigos
        #      (/index.html, /login.html, de e-mails, calendarios e atalhos ja
        #      instalados) redirecionam com 301; o navegador leva o #... junto.
        #      Location relativo: atras do tunel, a porta interna nao aparece. ----
        absolute_redirect off;
        location = / {
            expires -1;
            try_files /index.html =404;  # direto, sem o index (que iria a /index.html)
        }
        location = /login {
            expires -1;
            try_files /login.html =404;
        }
        location = /index.html { return 301 /$is_args$args; }
        # "Compartilhar" de outro app sem o service worker ativo: volta ao app (o sw.js atende normalmente).
        location = /compartilhar { return 303 /; }
        location = /login.html { return 301 /login$is_args$args; }

        # ---- HTML / navegacao: revalida sempre (sem isso o navegador podia
        #      mostrar uma tela antiga depois de um deploy). ----
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
