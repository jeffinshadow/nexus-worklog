<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar · Nexus Worklog</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121213">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/GoogleSansFlex.woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css?v=8">
  <link rel="stylesheet" href="/css/app.css?v=8">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="lockup lockup--center">
        <img class="lockup-mark" src="/img/dragon-mark.svg" alt="" width="26" height="30">
        <span class="lockup-type"><span>nexus</span><span>worklog</span></span>
      </div>
      <h1 class="sr-only">Entrar no Nexus Worklog</h1>

      <div class="auth-tabs hidden" role="tablist" id="auth-tabs">
        <button id="tab-login" type="button" role="tab" aria-selected="true">Entrar</button>
        <button id="tab-register" type="button" role="tab" aria-selected="false">Criar conta</button>
      </div>

      <form id="form-login" autocomplete="on">
        <div class="field">
          <label for="login-email">E-mail</label>
          <input id="login-email" name="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input id="login-password" name="password" type="password" required autocomplete="current-password">
        </div>
        <p class="error-text" id="login-error"></p>
        <button class="btn btn-primary full" type="submit">Entrar</button>
      </form>

      <form id="form-register" class="hidden" autocomplete="on">
        <div class="field">
          <label for="reg-email">E-mail</label>
          <input id="reg-email" name="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="reg-password">Senha (mínimo 10 caracteres)</label>
          <input id="reg-password" name="password" type="password" required minlength="10" autocomplete="new-password">
        </div>
        <p class="error-text" id="reg-error"></p>
        <button class="btn btn-primary full" type="submit">Criar conta</button>
      </form>

      <p class="auth-foot hidden" id="invite-note">acesso por convite · peça ao administrador</p>
    </div>
  </div>

  <script type="module" src="/js/login.js?v=8"></script>
  <script type="module" src="/js/pwa.js?v=8"></script>
</body>
</html>
